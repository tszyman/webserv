server {
    listen 8080;
    server_name localhost;
    client_max_body_size 100000001;

    location / {
        root www;
        allowed_methods GET;
    }

    location /youpi.bla {
        root YoupiBanane;
        allowed_methods POST;
        cgi_extension .bla;
        cgi_executable ./cgi_tester;
    }

    location /post_body {
        root www;
        allowed_methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root YoupiBanane;
        allowed_methods GET POST;
        index youpi.bad_extension;
        cgi_extension .bla;
        cgi_executable ./cgi_tester;
        client_max_body_size 100000001;
    }
}