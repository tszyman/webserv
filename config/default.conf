# Complete demonstration configuration for the mandatory webserv features.
# Run with: ./webserv config/default.conf

server {
    listen 8080;
    server_name localhost;
    client_max_body_size 1048576;

    # Static files, an index file, accepted methods, and custom error pages.
    location / {
        root www;
        allowed_methods GET;
        index index.html other_index.html;
        autoindex off;
        error_page 404 www/errors/404.html 500 www/errors/500.html;
    }

    # Redirect example: GET /redirect returns a 301 redirect to /.
    location /redirect {
        root www;
        allowed_methods GET;
        redirect 301 /;
    }

    # Directory listing example: GET /browse/ lists files in www/data/.
    location /browse {
        root www/data;
        allowed_methods GET;
        autoindex on;
    }

    # Multipart file uploads are stored in www/uploads/.
    location /upload {
        root www;
        allowed_methods POST;
        upload_enable on;
        upload_store www/uploads;
        client_max_body_size 524288;
    }

    # Uploaded files can be listed or deleted without exposing website assets.
    location /files {
        root www/uploads;
        allowed_methods GET DELETE;
        autoindex on;
    }

    # CGI example.  The included script is executed by Python for .py files.
    location /cgi {
        root www/cgi;
        allowed_methods POST;
        cgi_extension .py;
        cgi_executable /usr/bin/python3;
        client_max_body_size 1048576;
    }
}

# A second interface:port pair serving different default content.
server {
    listen 9000;
    server_name demo_server;

    location / {
        root www;
        allowed_methods GET;
        index other_index.html;
        autoindex off;
    }
}
